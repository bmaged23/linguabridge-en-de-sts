name: GPU image release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'web/**'
      - 'scripts/**'
      - 'config.py'
      - 'requirements/**'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'tests/**'
      - 'docs/reference/model-manifest.json'
      - 'deployment/**'
      - 'evaluation/datasets/**'
      - 'evaluation/config.py'
      - '.github/workflows/**'
      - '.dockerignore'
      - '!requirements/**/*.md'
      - '!requirements/archive/**'
      - '!scripts/**/*.md'
      - '!deployment/**/*.md'
permissions:
  contents: read
concurrency:
  group: linguabridge-gpu-release
  cancel-in-progress: false
jobs:
  tests:
    uses: ./.github/workflows/tests.yml
  build:
    if: github.repository == 'bmaged23/linguabridge-en-de-sts' && github.ref == 'refs/heads/main' && github.actor == 'bmaged23'
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      candidate: ghcr.io/bmaged23/linguabridge-en-de-sts-candidates@${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Free unused SDK space on the ephemeral hosted builder
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build tested candidate into staging registry
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/docker/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/bmaged23/linguabridge-en-de-sts-candidates:sha-${{ github.sha }}
          build-args: SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=linguabridge-gpu
          cache-to: type=gha,scope=linguabridge-gpu,mode=max
  publish:
    needs: [tests, build]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/gpu-qualification.yml
    with:
      source_sha: ${{ github.sha }}
      image_ref: ${{ needs.build.outputs.candidate }}
      pull_candidate: true
    secrets: inherit
