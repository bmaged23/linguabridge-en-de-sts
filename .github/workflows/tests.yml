name: Tests
on:
  workflow_call:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned application and test dependencies
        run: |
          python -m pip install --no-deps -r requirements/release/app.txt
      - name: Test without credentials, GPU or model downloads
        env:
          PYTHONPATH: src:.
        run: |
          python -m pytest -q -ra
          python -m compileall -q src scripts

