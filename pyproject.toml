[project]
name = "linguabridge-sts"
version = "0.1.0"
description = "English-German speech-to-speech conversation and translation with streaming STT, LLM, TTS and persistent memory"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.143.2",
  "uvicorn[standard]==0.54.0",
  "httpx==0.28.1",
  "numpy==2.5.4",
  "onnxruntime==1.31.0",
  "python-dotenv==1.2.4",
]

[dependency-groups]
dev = [
    "playwright==1.64.0",
    "psutil==7.2.2",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "websockets==16.1.1",
    "av==18.1.0",
    "faster-whisper==1.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/voice_bridge"]
